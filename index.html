<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnTrack — New site coming soon</title>
<meta name="description" content="OnTrack retirement planning. Our new website is on its way.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="brand/ontrack-icon.svg">
<meta name="theme-color" content="#2F6BEF">
<style>
  :root { --bg:#f8fafc; --surface:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b; --head:#0f172a; --brand:#2F6BEF; --brand-2:#5B8CF5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#020617; --surface:#0f172a; --line:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --head:#f8fafc; --brand:#6F9BFF; --brand-2:#9DBBFF; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { max-width: 560px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
         padding: 48px 32px; text-align: center; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
  .logo { display: inline-flex; align-items: center; gap: 12px; font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 2rem; color: var(--brand); letter-spacing: -.02em; }
  .mark { width: 44px; height: 44px; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.2; color: var(--head); margin: 28px 0 12px; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 auto; max-width: 42ch; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 32px auto 0; max-width: 240px; }
  .bar span { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, var(--brand), var(--brand-2));
              animation: slide 2.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 60%; } }
  footer { margin-top: 36px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs><clipPath id="ot-clip"><rect width="64" height="64" rx="16"/></clipPath></defs>
      <g clip-path="url(#ot-clip)">
        <rect width="64" height="64" fill="var(--brand)"/>
        <path d="M-4 30 C 12 26, 24 16, 30 -4" fill="none" stroke="var(--surface)" stroke-width="8" stroke-linecap="round"/>
      </g>
    </svg>
    <span class="word">OnTrack</span>
  </div>
  <h1>Our new website is on its way</h1>
  <p>We're building something new to help you plan a confident retirement. Please check back soon.</p>
  <div class="bar" aria-hidden="true"><span></span></div>
  <footer>&copy; <span id="y">2026</span> OnTrack</footer>
</main>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
