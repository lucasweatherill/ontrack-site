<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OnTrack">
  <defs><clipPath id="ot-clip"><rect width="64" height="64" rx="16"/></clipPath></defs>
